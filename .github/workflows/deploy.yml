name: Build and deploy the landing page
on:
  push:
    branches: [main]
concurrency:
  group: blockfield-web
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/netherg-io/blockfield-site:${{ github.sha }}
            ghcr.io/netherg-io/blockfield-site:latest
      - name: Deploy through the Dokploy webhook
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_SITE_WEBHOOK }}
        run: curl -fsS --retry 3 --retry-delay 5 -X POST "$WEBHOOK"
