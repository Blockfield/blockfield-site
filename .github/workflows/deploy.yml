name: Build and deploy the landing page
on:
  workflow_dispatch:
concurrency:
  group: blockfield-site
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blockfield
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: blockfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockfield -d blockfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: just setup
      - run: just check

      - run: just test-postgres
        env:
          BLOCKFIELD_TEST_DATABASE_URL: postgres://blockfield:test-only@localhost:5432/blockfield_test
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/blockfield/blockfield-site:${{ github.sha }}
            ghcr.io/blockfield/blockfield-site:latest
      - name: Deploy through the Dokploy webhook
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_SITE_WEBHOOK }}
        run: curl -fsS --retry 3 --retry-delay 5 -X POST "$WEBHOOK"
      # The webhook only queues a Dokploy deploy; fail the job if the site never switches to this build.
      - name: Wait until blockfield.pro serves this commit
        env:
          SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 600))
          until [ "$(curl -fsS --max-time 10 https://blockfield.pro/api/version | jq -r .commit)" = "$SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::blockfield.pro did not serve $SHA within 10 minutes"
              exit 1
            fi
            sleep 10
          done
          echo "blockfield.pro serves $SHA after ${SECONDS}s"
