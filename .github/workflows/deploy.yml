name: Build and deploy the landing page
on:
  push:
    branches: [main]
concurrency:
  group: blockfield-web
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blockfield
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: blockfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockfield -d blockfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
        env:
          BLOCKFIELD_TEST_DATABASE_URL: postgres://blockfield:test-only@localhost:5432/blockfield_test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Web builds only on main, so the gha cache scope is readable by every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/netherg-io/blockfield-site:${{ github.sha }}
            ghcr.io/netherg-io/blockfield-site:latest
      - name: Deploy through the Dokploy webhook
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_SITE_WEBHOOK }}
        run: curl -fsS --retry 3 --retry-delay 5 -X POST "$WEBHOOK"
