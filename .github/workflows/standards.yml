name: Code standards
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read # decide job looks up the green standards run for this tree
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Cheap skip decision on a free runner: main pushes that merge an
  # already-tested tree never occupy a paid Blacksmith runner.
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested: ${{ steps.same.outputs.tested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Main pushes usually merge a tree a green PR run already tested.
      # PR runs check out the merge ref, so head_sha's tree differs when the PR
      # was behind main: the PR job records its tested merge tree as an artifact.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=$(scripts/ci-same-tree.sh standards.yml)
          echo "Same tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
  check:
    needs: decide
    if: needs.decide.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blockfield
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: blockfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockfield -d blockfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fail on CRLF in the Git index
        shell: bash
        run: |
          git ls-files --eol | awk '$3=="attr/-text"{next} $1=="i/crlf"||$1=="i/mixed"{print $NF; bad=1} tolower($NF)~/\.(bat|cmd)$/{print $NF": missing -text"; bad=1} END{exit bad}' \
            || { echo "CRLF in the Git index or .bat/.cmd without -text; fix with: git add --renormalize ."; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint JavaScript and embedded styles
        run: |
          pnpm lint
          pnpm stylelint
      - name: Check source formatting
        run: pnpm format:check
      - name: Check TypeScript and Astro components
        run: pnpm typecheck
      - name: Run behavior tests
        run: pnpm test
        env:
          BLOCKFIELD_TEST_DATABASE_URL: postgres://blockfield:test-only@localhost:5432/blockfield_test

      - run: pnpm build
      # Records the exact tree this green PR run tested (the merge ref), so a
      # merge skips even when the PR branch itself was behind an unmoved main.
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
  postgres:
    needs: decide
    if: needs.decide.outputs.tested != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: blockfield
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: blockfield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockfield -d blockfield_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:postgres
        env:
          BLOCKFIELD_TEST_DATABASE_URL: postgres://blockfield:test-only@localhost:5432/blockfield_test
