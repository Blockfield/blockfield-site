http:
  routers:
    blockfield-browser404-apex:
      rule: 'Host(`blockfield.pro`) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)(^|,)[ \t]*text/html([ \t]*;|[ \t]*,|[ \t]*$)`) && !(Path(`/api`) || PathPrefix(`/api/`))'
      priority: 23
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: blockfield-web-pojcp4-service-64@file
      middlewares:
        - redirect-blockfield-web-pojcp4-1@file
        - blockfield-browser404
    blockfield-browser404-www:
      rule: 'Host(`www.blockfield.pro`) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)(^|,)[ \t]*text/html([ \t]*;|[ \t]*,|[ \t]*$)`) && !(Path(`/api`) || PathPrefix(`/api/`))'
      priority: 27
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: blockfield-web-pojcp4-service-65@file
      middlewares:
        - redirect-blockfield-web-pojcp4-1@file
        - blockfield-browser404
    blockfield-browser404-bot:
      rule: 'Host(`bot.blockfield.pro`) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)(^|,)[ \t]*text/html([ \t]*;|[ \t]*,|[ \t]*$)`) && !(Path(`/api`) || PathPrefix(`/api/`))'
      priority: 27
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: blockfield-discordbot-bul1tb-service-90@file
      middlewares:
        - blockfield-browser404
    blockfield-browser404-skins:
      rule: 'Host(`skins.blockfield.pro`) && (Method(`GET`) || Method(`HEAD`)) && HeaderRegexp(`Accept`, `(?i)(^|,)[ \t]*text/html([ \t]*;|[ \t]*,|[ \t]*$)`) && !(Path(`/api`) || PathPrefix(`/api/`))'
      priority: 29
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: compose-reboot-cross-platform-array-ezavj8-66-websecure@docker
      middlewares:
        - blockfield-browser404
  middlewares:
    blockfield-browser404:
      errors:
        status:
          - '404'
        service: blockfield-errors@docker
        query: /404.html
        errorRequestHeaders: []
    blockfield-404-path:
      replacePath:
        path: /404.html
