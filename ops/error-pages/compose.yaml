services:
  error-pages:
    image: ghcr.io/tarampampam/error-pages@sha256:6d42b5d6e1a014fa2373e3587f9e85c25589a089fd5f6fc4f2a496858f5e365d
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    command:
      - --html-template=/opt/error-pages/blockfield.html
      - --disable-l10n
      - --send-same-http-code
    volumes:
      - ./blockfield.html:/opt/error-pages/blockfield.html:ro
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.blockfield-errors.loadbalancer.server.port=8080
      - traefik.http.routers.blockfield404-http.rule=HostRegexp(`^[^.]+\.blockfield\.pro$`)
      - traefik.http.routers.blockfield404-http.ruleSyntax=v3
      - traefik.http.routers.blockfield404-http.entrypoints=web
      - traefik.http.routers.blockfield404-http.priority=1
      - traefik.http.routers.blockfield404-http.service=blockfield-errors
      - traefik.http.routers.blockfield404-http.middlewares=blockfield404-https
      - traefik.http.middlewares.blockfield404-https.redirectscheme.scheme=https
      - traefik.http.middlewares.blockfield404-https.redirectscheme.permanent=true
      - traefik.http.routers.blockfield404.rule=HostRegexp(`^[^.]+\.blockfield\.pro$`)
      - traefik.http.routers.blockfield404.ruleSyntax=v3
      - traefik.http.routers.blockfield404.entrypoints=websecure
      - traefik.http.routers.blockfield404.priority=1
      - traefik.http.routers.blockfield404.service=blockfield-errors
      - traefik.http.routers.blockfield404.middlewares=blockfield-404-path@file
      - traefik.http.routers.blockfield404.tls.certresolver=letsencrypt
      - traefik.http.routers.blockfield404.tls.domains[0].main=blockfield.pro
      - traefik.http.routers.blockfield404.tls.domains[0].sans=*.blockfield.pro
networks:
  dokploy-network:
    external: true
